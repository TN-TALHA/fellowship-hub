# ============================================================================
#  Fellowship Hub — CI Pipeline
# ============================================================================
#  Every gate below must be GREEN before a pull request is allowed to merge.
#
#    1. lint     — ruff: style, import order, likely bugs
#    2. test     — pytest: the whole suite must pass
#                  coverage: minimum 85% line coverage (gate in pyproject.toml)
#    3. docker   — the image must build AND the container must answer HTTP
#
#  The gates run on every push to main and on every pull request, so a broken
#  commit is caught before it reaches production — not at 5 PM on a Friday.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you run the pipeline by hand from the Actions tab

# A new push to the same branch cancels the older, still-running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------------------------------------------ GATE 1
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check . --output-format=github

  # ------------------------------------------------------------------ GATE 2
  test:
    name: Tests + coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # fail_under = 85 lives in pyproject.toml, so coverage itself fails the
      # step when the number drops. No extra flag needed here.
      - name: Run pytest with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Upload test + coverage reports
        if: always()          # upload even when the tests failed — that's when you need them
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml
          retention-days: 7

  # ------------------------------------------------------------------ GATE 3
  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]       # only runs if gates 1 and 2 were green

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t fellowship-hub:ci .

      - name: Start the container
        run: docker run -d --name fh -p 5000:5000 fellowship-hub:ci

      # Build succeeding is not the same as the app working. Poll the login
      # page until it answers 200, or fail after 30 seconds.
      - name: Smoke test — the app must answer HTTP 200
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/login || true)
            if [ "$code" = "200" ]; then
              echo "App is up (HTTP $code) after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "App never became healthy. Container logs:"
          docker logs fh
          exit 1

      - name: Stop the container
        if: always()
        run: docker rm -f fh || true

  # --------------------------------------------------------------- SUMMARY
  # One job that depends on all three. Make THIS the required status check in
  # branch protection and you never have to update the list again.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, test, docker]
    if: always()
    steps:
      - name: Verify every gate was green
        run: |
          echo "lint:   ${{ needs.lint.result }}"
          echo "test:   ${{ needs.test.result }}"
          echo "docker: ${{ needs.docker.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more quality gates failed — merge is blocked."
            exit 1
          fi
          echo "All quality gates green."
