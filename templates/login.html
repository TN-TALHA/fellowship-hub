<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Login · FellowshipHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: radial-gradient(1200px 800px at 20% -20%, #1e3a8a33, transparent),
                radial-gradient(900px 600px at 80% 120%, #a855f733, transparent),
                #070b14;
    color: #e6edf6;
    min-height: 100vh;
    display: grid;
    place-items: center;
  }
  .login-wrap {
    width: 100%;
    max-width: 420px;
    padding: 40px 36px;
    background: rgba(20, 28, 46, 0.75);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 20px;
    backdrop-filter: blur(24px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .logo-mark {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, #5b9dff, #a78bfa);
    display: grid; place-items: center; font-weight: 800; color: #0b1120;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .sub { color: #8896ad; font-size: 13px; margin-bottom: 26px; }
  label { display: block; font-size: 12.5px; color: #8896ad; margin-bottom: 6px; font-weight: 500; }
  input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(7, 11, 20, 0.6);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 10px;
    color: #e6edf6;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 16px;
    outline: none;
    transition: all 0.2s;
  }
  input:focus { border-color: #5b9dff; box-shadow: 0 0 0 3px rgba(91,157,255,0.15); }
  button {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #5b9dff, #a78bfa);
    color: #0b1120;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s, box-shadow 0.2s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(91,157,255,0.4); }
  button:disabled { opacity: 0.6; cursor: wait; }
  .error {
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.35);
    color: #f87171;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .demo-creds {
    margin-top: 20px;
    padding: 14px;
    background: rgba(91, 157, 255, 0.07);
    border: 1px solid rgba(91, 157, 255, 0.2);
    border-radius: 10px;
    font-size: 12px;
    color: #8896ad;
    line-height: 1.7;
  }
  .demo-creds strong { color: #5b9dff; }
</style>
</head>
<body>
<form class="login-wrap" id="login-form">
  <div class="logo-row">
    <div class="logo-mark">FH</div>
    <div>
      <h1>FellowshipHub</h1>
      <div class="sub">Sign in to continue</div>
    </div>
  </div>

  <div class="error" id="error"></div>

  <label>Username</label>
  <input name="username" id="username" placeholder="e.g. admin" required autofocus />

  <label>Password</label>
  <input name="password" id="password" type="password" placeholder="••••••••" required />

  <button id="login-btn">Sign in →</button>

  <div class="demo-creds">
    <div><strong>Admin:</strong> admin / admin123</div>
    <div><strong>Member:</strong> ayesha / pass123</div>
  </div>
</form>

<script>
const form = document.getElementById("login-form");
const btn = document.getElementById("login-btn");
const err = document.getElementById("error");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Signing in...";
  const fd = new FormData(form);
  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: fd.get("username"),
        password: fd.get("password"),
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Login failed");
    window.location.href = "/";
  } catch (e) {
    err.textContent = e.message;
    err.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Sign in →";
  }
});
</script>
</body>
</html>
